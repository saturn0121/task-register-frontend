<div class="max-w-3xl mx-auto mt-8 px-4 pb-12">
  <h1 class="text-2xl font-bold mb-4">Tasks</h1>

  <a routerLink="/create"
       class="inline-block bg-blue-600 text-white px-4 py-2 rounded mb-4">
      New Task
  </a>

  <form (ngSubmit)="loadTasks()" class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4">
    <input type="text" name="search" [(ngModel)]="search"
           placeholder="Search title..."
           class="border rounded px-3 py-2 sm:col-span-2">

    <select name="status" [(ngModel)]="status"
            class="border rounded px-3 py-2">
      <option value="">All statuses</option>
      <option value="open">Open</option>
      <option value="in_progress">In Progress</option>
      <option value="done">Done</option>
    </select>

    <select name="priority" [(ngModel)]="priority"
            class="border rounded px-3 py-2">
      <option value="">All priorities</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>

    <select name="assignedTo" [(ngModel)]="assignedTo"
            class="border rounded px-3 py-2">
      <option value="">All owners</option>
      <option value="none">Unassigned</option>
      <option *ngFor="let user of users" [value]="user.id">{{ user.name }}</option>
    </select>

    <label class="flex items-center gap-2 px-1 py-2">
      <input type="checkbox" name="overdueOnly" [(ngModel)]="overdueOnly">
      <span class="text-sm">Overdue only</span>
    </label>

    <div class="flex gap-2 sm:col-span-2">
      <button type="submit" class="bg-gray-700 text-white px-4 py-2 rounded">
        Filter
      </button>
      <button *ngIf="hasFilters" type="button" (click)="clearFilters()"
              class="border px-4 py-2 rounded text-gray-700">
        Clear
      </button>
    </div>
  </form>

  <p *ngIf="errorMessage" class="text-red-600 mb-4">{{ errorMessage }}</p>
  <p *ngIf="loading" class="text-gray-500 text-sm mb-4">Loading...</p>
  <p *ngIf="!loading && !errorMessage && tasks.length === 0" class="text-gray-500 mb-4">
    No tasks match.
  </p>

  <ul class="divide-y">
    <li *ngFor="let task of tasks" class="py-3 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2">
      <div>
        <span class="font-medium">{{ task.title }}</span>
        <div class="text-xs text-gray-500 mt-1 flex flex-wrap items-center gap-x-3 gap-y-1">
          <span>{{ task.assignee ? task.assignee.name : 'Unassigned' }}</span>
          <span *ngIf="task.due_date" [class.text-red-600]="isOverdue(task)" [class.font-semibold]="isOverdue(task)">
            Due {{ task.due_date }}<span *ngIf="isOverdue(task)"> (overdue)</span>
          </span>
        </div>
      </div>

      <span class="flex flex-wrap items-center gap-3">
        <span class="text-xs px-2 py-0.5 rounded-full" [ngClass]="priorityClass(task.priority)">
          {{ task.priority }}
        </span>
        <span class="text-sm text-gray-500">{{ task.status }}</span>

        <ng-container *ngIf="confirmingId !== task.id">
          <a [routerLink]="['/edit', task.id]" class="text-blue-600 text-sm py-1">Edit</a>
          <button *ngIf="authService.isAdmin()" type="button" (click)="askDelete(task.id)"
                  class="text-red-600 text-sm py-1">
            Delete
          </button>
        </ng-container>

        <ng-container *ngIf="confirmingId === task.id">
          <span class="text-sm">Delete this task?</span>
          <button type="button" (click)="confirmDelete(task.id)"
                  [disabled]="deletingId === task.id"
                  class="bg-red-600 text-white text-sm px-2 py-1 rounded disabled:opacity-50">
            {{ deletingId === task.id ? 'Deleting...' : 'Yes, delete' }}
          </button>
          <button type="button" (click)="cancelDelete()"
                  [disabled]="deletingId === task.id"
                  class="text-gray-600 text-sm">
            Cancel
          </button>
        </ng-container>
      </span>
    </li>
  </ul>
</div>
