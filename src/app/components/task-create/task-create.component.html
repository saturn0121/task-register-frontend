<div class="max-w-md mx-auto mt-8 px-4">
  <h1 class="text-2xl font-bold mb-4">New Task</h1>

  <p *ngIf="errorMessage" class="text-red-600 mb-4">{{ errorMessage }}</p>

  <app-task-form
    [task]="task"
    [fieldErrors]="fieldErrors"
    submitLabel="Create Task"
    (save)="onSave($event)">
  </app-task-form>
</div>
